name: 'Build and run tests'

concurrency:
  group: build

on:
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'
    paths:
      - "**.ts"
      - "**.json"
      - "action.yml"
      - "dist/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      - name: Check dist is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is out of date, run npm run build and commit the result"
            git status --porcelain dist
            exit 1
          fi

      - uses: ./
        id: "check-success"
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          currentRunId: 0  # an invalid run id includes this run, so its own job is found as running
          runnerLabel: "ubuntu-latest"
      - uses: ./
        id: "check-failed"
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          currentRunId: ${{ github.run_id }} # this run is excluded; usually no other workflow is running in this repo
          runnerLabel: "ubuntu-latest"
      - name: Validate Result (If Statement)
        # The output has to be compared to the string 'true', not the boolean
        if: ${{ steps.check-success.outputs.foundRunningJob == 'true' && steps.check-failed.outputs.foundRunningJob == 'false'}}
        run: exit 0
      - name: Validate Result (Shell)
        run: |
          if [ '${{ steps.check-success.outputs.foundRunningJob }}' == true -a '${{ steps.check-failed.outputs.foundRunningJob }}' == false ]; then
            exit 0
          else
            exit 1
          fi
