name: 'Build and run tests'

on:
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'
    paths:
      - "**.ts"
      - "**.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "action.yml"
      - "dist/**"
      - ".github/workflows/test.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node

      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

      - name: Check dist is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is out of date, run pnpm build and commit the result"
            git status --porcelain dist
            exit 1
          fi

      # runner.name is unique per GitHub-hosted job, unlike ubuntu-latest, which other runs (e.g. Dependabot) also use
      - uses: ./
        id: "check-success"
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          currentRunId: 0  # an invalid run id includes this run, so its own job is found as running
          runnerLabel: ${{ runner.name }}
      - uses: ./
        id: "check-failed"
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          currentRunId: ${{ github.run_id }} # this run is excluded, and no other job runs on this job's runner
          runnerLabel: ${{ runner.name }}
      - name: Validate Result (If Statement)
        # The output has to be compared to the string 'true', not the boolean
        if: ${{ steps.check-success.outputs.foundRunningJob == 'true' && steps.check-failed.outputs.foundRunningJob == 'false'}}
        run: exit 0
      - name: Validate Result (Shell)
        run: |
          if [ '${{ steps.check-success.outputs.foundRunningJob }}' == true -a '${{ steps.check-failed.outputs.foundRunningJob }}' == false ]; then
            exit 0
          else
            exit 1
          fi
