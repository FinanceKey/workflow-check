name: 'Release new version'
on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Increment Type (major, minor, patch)"
        required: true
        default: 'patch'
        type: 'choice'
        options:
          - 'major'
          - 'minor'
          - 'patch'
permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node

      - name: Build
        run: pnpm run build && git add .

      - name: Check CI
        id: check-ci
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          currentRunId: 0  # we give an invalid run id which results in finding this current run as running, therefore reporting running job found.
          runnerLabel: "ubuntu-latest"

      - name: Release
        if: ${{ steps.check-ci.outputs.foundRunningJob == 'true' }}
        # release-it reads GITHUB_TOKEN to create the GitHub Release. It is set only on this step:
        # the Check CI step gets the token via `with: token`, and @octokit/auth-action fails if it is set twice
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'Rony'
          git config --global user.email 'workflow-check.github.com@spot-light.ch'
          pnpm release --ci --increment ${{ github.event.inputs.increment }}
