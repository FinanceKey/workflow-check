name: 'Setup Node'
description: 'Sets up pnpm and Node.js, installs safe-chain, and installs dependencies'

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache-dependency-path: pnpm-lock.yaml
        cache: pnpm

    - name: Install safe-chain
      shell: bash
      env:
        EXPECTED_HASH: "7c910fff717649c86cc8ca960e6c054d3734da2d660050e3bcfc54029e3b485b"
      run: |
        curl --proto "=https" -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.1/install-safe-chain.sh -o /tmp/install-safe-chain.sh
        echo "$EXPECTED_HASH  /tmp/install-safe-chain.sh" | sha256sum --check --status || { echo "Hash verification failed"; exit 1; }
        bash /tmp/install-safe-chain.sh --ci

    - name: Install dependencies
      shell: bash
      run: SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS=24 pnpm install --ignore-scripts --frozen-lockfile
