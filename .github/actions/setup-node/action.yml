name: 'Setup Node'
description: 'Sets up Node.js, pnpm, installs safe-chain, ensures package manager is up to date, and installs npm dependencies'

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache-dependency-path: pnpm-lock.yaml
        cache: pnpm

    - name: Install safe-chain
      shell: bash
      env:
        EXPECTED_HASH: "7c910fff717649c86cc8ca960e6c054d3734da2d660050e3bcfc54029e3b485b"
      run: |
        curl --proto "=https" -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.1/install-safe-chain.sh -o /tmp/install-safe-chain.sh
        echo "$EXPECTED_HASH  /tmp/install-safe-chain.sh" | sha256sum --check --status || { echo "Hash verification failed"; exit 1; }
        bash /tmp/install-safe-chain.sh --ci

    - name: Ensure package manager is up to date
      shell: bash
      run: corepack install

    - name: Install frontend dependencies
      shell: bash
      run: SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS=24 pnpm install --ignore-scripts --frozen-lockfile
