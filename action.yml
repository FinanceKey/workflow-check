name: Workflow Checker
description: Check if there are any other pending, queued or in progress jobs on a given self-hosted runner
branding:
  icon: check-circle
  color: blue
inputs:
  token:
    description: 'GITHUB_TOKEN, needs actions: read'
    required: true
  currentRunId:
    description: 'The run id of the current run, excluded from the results. Pass in github.run_id'
    required: true
  runnerLabel:
    description: 'Runner to check: matched against the runner name (the label itself or <label>-<n>) and the requested runs-on labels'
    required: true
outputs:
  foundRunningJob:
    description: 'true if other running jobs have been found, false otherwise'
runs:
  using: 'node24'
  main: 'dist/index.js'
